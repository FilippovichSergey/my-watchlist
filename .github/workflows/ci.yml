name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: mvn -B --no-transfer-progress verify
      - name: Database tests must have run, not skipped
        run: |
          report=target/surefire-reports/TEST-com.watchlist.DatabaseSchemaTest.xml
          test -f "$report" || { echo "no surefire report for DatabaseSchemaTest"; exit 1; }
          grep -Eq 'tests="[1-9][0-9]*"' "$report" && grep -q 'skipped="0"' "$report"
      - name: Docker image builds with the same Java version
        run: docker build .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
