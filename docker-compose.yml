services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: watchlist
      POSTGRES_USER: watchlist
      POSTGRES_PASSWORD: watchlist
    ports:
      # Development-only password, so listen on loopback rather than every interface
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watchlist"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8080:8080"
    # TMDB and Google settings come from backend/.env. The database lines below override its
    # localhost values, because inside the compose network Postgres is reached by service name.
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/watchlist
      DATABASE_USER: watchlist
      DATABASE_PASSWORD: watchlist
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
