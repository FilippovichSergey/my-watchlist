services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: watchlist
      POSTGRES_USER: watchlist
      POSTGRES_PASSWORD: watchlist
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watchlist"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/watchlist
      DATABASE_USER: watchlist
      DATABASE_PASSWORD: watchlist
      TMDB_API_KEY: ${TMDB_API_KEY}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
